<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ONnOFF² · 설문 리포트</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;width:100%;position:fixed;height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;color:#1d1d1f;-webkit-font-smoothing:antialiased;min-height:100%;width:100%;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ===== LOGIN ===== */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;overflow:hidden}
.login-box{background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,0.08);padding:48px 40px 40px;width:100%;max-width:380px;text-align:center}
.login-box h1{font-size:24px;font-weight:700;letter-spacing:-0.3px;margin-bottom:6px}
.login-box .sub{font-size:13px;color:#86868b;margin-bottom:24px}
.source-toggle{display:flex;gap:8px;margin-bottom:20px}
.source-btn{flex:1;padding:12px 0;border:1.5px solid #d2d2d7;border-radius:10px;background:#fff;font-size:14px;font-weight:600;color:#86868b;cursor:pointer;transition:all .2s}
.source-btn.active{border-color:#0071e3;background:#0071e3;color:#fff}
.source-btn .flag{font-size:18px;display:block;margin-bottom:4px}
.pw-wrap{position:relative;margin-bottom:12px}
.pw-wrap input{width:100%;padding:14px 48px 14px 16px;border:1.5px solid #d2d2d7;border-radius:10px;font-size:15px;outline:none;transition:border-color .2s}
.pw-wrap input:focus{border-color:#0071e3}
.pw-wrap input.error{border-color:#ff3b30;animation:shake .4s}
.pw-wrap .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#86868b;font-size:18px;background:none;border:none;padding:4px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.login-btn{width:100%;padding:14px;background:#0071e3;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.login-btn:hover{background:#0077ed}
.err-msg{color:#ff3b30;font-size:12px;margin-top:8px;min-height:18px}
.ver{color:#c7c7cc;font-size:11px;margin-top:20px}

/* ===== LOADING ===== */
.loading{text-align:center;padding:120px 40px}
.loading .spinner{width:32px;height:32px;border:3px solid #e8e8ed;border-top-color:#0071e3;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:#86868b;font-size:14px}

/* ===== DASHBOARD ===== */
.hero{background:#f5f5f7;padding:64px 40px 52px;text-align:center}
.hero h1{font-size:34px;font-weight:700;letter-spacing:-.5px;margin-bottom:10px;color:#1d1d1f}
.hero p{font-size:14px;color:#86868b}
.stats-strip{max-width:820px;margin:-32px auto 0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.06);position:relative;z-index:2}
.stat-item{padding:28px 16px;text-align:center;border-right:1px solid #f0f0f0}
.stat-item:last-child{border-right:none}
.stat-num{font-size:28px;font-weight:700;color:#1d1d1f}
.stat-label{font-size:11px;color:#86868b;margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.wrap{max-width:820px;margin:0 auto;padding:48px 24px}
.sec-title{font-size:22px;font-weight:700;margin-bottom:4px;color:#1d1d1f}
.sec-sub{font-size:13px;color:#86868b;margin-bottom:28px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.card{background:rgba(255,255,255,0.3);border:1px solid #e8e8ed;border-radius:14px;padding:24px}
.card-title{font-size:14px;font-weight:700;color:#000;margin-bottom:2px}
.card-sub{font-size:11px;color:#6e6e73;margin-bottom:16px}
.donut-wrap{position:relative;width:180px;height:180px;margin:0 auto}
.donut-legend{margin-top:14px}
.donut-legend .item{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px;color:#3a3a3c}
.donut-legend .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.donut-legend .val{margin-left:auto;font-weight:700;color:#000;font-size:11px;white-space:nowrap}
.bar-wrap{height:160px}
.rev{background:#f5f5f7;border-radius:14px;padding:28px;margin-bottom:20px}
.rev-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rev-card{background:#fff;border:1px solid #e8e8ed;border-radius:10px;padding:20px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rev-card .big{font-size:20px;font-weight:700;color:#1d1d1f}
.rev-card .big.accent{color:#0071e3}
.rev-card .rl{font-size:10px;color:#86868b;margin-top:4px;text-transform:uppercase;letter-spacing:.3px}
.msg-wrap{background:#f5f5f7;border-radius:14px;padding:16px 12px}
.msg{background:rgba(255,255,255,0.7);border:1px solid #e8e8ed;border-radius:10px;padding:14px 16px;margin-bottom:8px}
.msg:last-child{margin-bottom:0}
.msg-meta{font-size:11px;color:#86868b;margin-bottom:4px;font-weight:500}
.msg-text{font-size:14px;line-height:1.6;color:#1d1d1f}
.msg-orig{font-size:12px;color:#aeaeb2;margin-top:4px}
.hidden{display:none}
@media(max-width:600px){
  .hero{padding:48px 20px 40px}
  .hero h1{font-size:26px}
  .stats-strip{grid-template-columns:repeat(2,1fr);margin:-24px 16px 0}
  .stat-item:nth-child(2){border-right:none}
  .stat-item:nth-child(4){border-right:none}
  .grid-2{grid-template-columns:1fr}
  .rev-grid{grid-template-columns:1fr 1fr}
  .wrap{padding:36px 16px}
  .login-box{padding:36px 24px 32px}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-wrap">
<div class="login-box">
<h1>ONnOFF² 팬미팅</h1>
<p class="sub">팬미팅 설문 리포트 · 관계자 전용</p>
<div class="source-toggle">
<button class="source-btn active" id="btnJp" onclick="pickSource('jp')"><span class="flag">🇯🇵</span>JAPAN</button>
<button class="source-btn" id="btnKr" onclick="pickSource('kr')"><span class="flag">🇰🇷</span>한국</button>
</div>
<div class="pw-wrap">
<input type="password" id="pwInput" placeholder="비밀번호를 입력하세요" autocomplete="off">
<button class="eye" onclick="togglePw()">
<svg id="eyeOff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
<svg id="eyeOn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
</button>
</div>
<button class="login-btn" onclick="tryLogin()">로그인</button>
<div class="err-msg" id="errMsg"></div>
<div class="ver">3.0.0</div>
</div>
</div>

<!-- LOADING -->
<div id="loader" class="loading hidden">
<div class="spinner"></div>
<p>데이터 불러오는 중...</p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
<div class="hero">
<h1 id="heroTitle">ONnOFF²</h1>
<p>설문 리포트 · <span id="heroTotal"></span>명 응답 · 실시간</p>
</div>
<div class="stats-strip">
<div class="stat-item"><div class="stat-num" id="sTotal"></div><div class="stat-label">총 응답</div></div>
<div class="stat-item"><div class="stat-num" id="sPos"></div><div class="stat-label">참가 긍정률</div></div>
<div class="stat-item"><div class="stat-num" id="sRegion"></div><div class="stat-label" id="sRegionLabel">일본 거주</div></div>
<div class="stat-item"><div class="stat-num" id="sMsg"></div><div class="stat-label">팬 메시지</div></div>
</div>
<div class="wrap">
<div class="sec-title">설문 결과</div>
<div class="sec-sub" id="surveySubtitle"></div>
<div class="grid-2">
<div class="card">
<div class="card-title" id="countryTitle">거주 국가·지역</div>
<div class="card-sub" id="subCountry"></div>
<div class="donut-wrap"><canvas id="d-country"></canvas></div>
<div class="donut-legend" id="leg-country"></div>
</div>
<div class="card">
<div class="card-title">팬미팅 참가 의향</div>
<div class="card-sub" id="subPart"></div>
<div class="donut-wrap"><canvas id="d-part"></canvas></div>
<div class="donut-legend" id="leg-part"></div>
</div>
</div>
<div class="grid-2">
<div class="card">
<div class="card-title">희망 개최 도시</div>
<div class="card-sub" id="subCity"></div>
<div class="bar-wrap"><canvas id="b-city"></canvas></div>
</div>
<div class="card">
<div class="card-title">희망 티켓 가격대</div>
<div class="card-sub" id="subPrice"></div>
<div class="donut-wrap"><canvas id="d-price"></canvas></div>
<div class="donut-legend" id="leg-price"></div>
</div>
</div>
<div class="card" style="margin-bottom:20px">
<div class="card-title">기대 프로그램</div>
<div class="card-sub" id="subProg"></div>
<div class="bar-wrap"><canvas id="b-prog"></canvas></div>
</div>
<div class="rev">
<div class="sec-title">예상 수익 시뮬레이션</div>
<div class="sec-sub" id="revSubtitle">참가 의향 가중치 × 평균 티켓가 기반 · 표준편차 보정</div>
<div class="rev-grid">
<div class="rev-card"><div class="big" id="rAvg"></div><div class="rl">평균 티켓가</div></div>
<div class="rev-card"><div class="big" id="rStd"></div><div class="rl">오차범위 (±σ)</div></div>
<div class="rev-card"><div class="big accent" id="rOpt"></div><div class="rl" id="rOptLabel"></div><div class="rl" id="rOptSub" style="margin-top:2px"></div></div>
<div class="rev-card"><div class="big" id="rCon"></div><div class="rl" id="rConLabel"></div><div class="rl" id="rConSub" style="margin-top:2px"></div></div>
</div>
</div>
<div class="sec-title">캐스트에게 보내는 메시지</div>
<div class="sec-sub" id="msgSubtitle"></div>
<div class="msg-wrap"><div id="msgList"></div></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script>
var HASH = '7fe4499f716f5fa481f8882e8c9d4977d73b98efc01e4cea06ee0f5879ca1877';
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwKf8XmTwjVmv_5QeCGFstHohdKeuMV58VrtHiigYzDAWHcQJsWQpFIH5_wmgfO8mJHxg/exec';
var selectedSource = 'jp';

function getProxies(src) {
  var base = APPS_SCRIPT_URL + '?source=' + src + '&_t=' + Date.now();
  return [
    'https://corsproxy.io/?' + encodeURIComponent(base),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(base),
    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(base)
  ];
}

function pickSource(src) {
  selectedSource = src;
  document.getElementById('btnJp').className = 'source-btn' + (src === 'jp' ? ' active' : '');
  document.getElementById('btnKr').className = 'source-btn' + (src === 'kr' ? ' active' : '');
}

// 카카오톡 인앱브라우저 우회
var ua = navigator.userAgent || '';
var isKakao = /KAKAOTALK/i.test(ua);
if (isKakao) {
  document.getElementById('loginScreen').style.display = 'none';
  if (/android/i.test(ua)) location.href = 'intent://' + location.host + location.pathname + '#Intent;scheme=https;package=com.android.chrome;end';
  else location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
}

async function sha256(t) {
  var d = new TextEncoder().encode(t);
  var b = await crypto.subtle.digest('SHA-256', d);
  return Array.from(new Uint8Array(b)).map(function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
}

function togglePw() {
  var inp = document.getElementById('pwInput');
  var on = document.getElementById('eyeOn');
  var off = document.getElementById('eyeOff');
  if (inp.type === 'text') { inp.type = 'password'; on.style.display = 'none'; off.style.display = ''; }
  else { inp.type = 'text'; on.style.display = ''; off.style.display = 'none'; }
}

async function tryLogin() {
  var pw = document.getElementById('pwInput').value;
  if (await sha256(pw) === HASH) {
    sessionStorage.setItem('auth', '1');
    sessionStorage.setItem('source', selectedSource);
    location.reload();
    return;
  } else {
    var inp = document.getElementById('pwInput');
    inp.classList.add('error');
    document.getElementById('errMsg').textContent = '비밀번호가 틀렸습니다';
    setTimeout(function(){ inp.classList.remove('error'); }, 500);
  }
}

document.getElementById('pwInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') tryLogin(); });

// 자동 로그인
if (sessionStorage.getItem('auth') === '1' && !isKakao) {
  selectedSource = sessionStorage.getItem('source') || 'jp';
  loadDash();
}

function loadDash() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('loader').classList.remove('hidden');
  raceFetch();
  sendVisitLog();
}

function sendVisitLog() {
  var uaStr = navigator.userAgent || '';
  var browser = /Edg/.test(uaStr) ? 'Edge' : /Chrome/.test(uaStr) ? 'Chrome' : /Safari/.test(uaStr) ? 'Safari' : /Firefox/.test(uaStr) ? 'Firefox' : uaStr;
  var os = /iPhone|iPad/.test(uaStr) ? 'iOS' : /Android/.test(uaStr) ? 'Android' : /Mac/.test(uaStr) ? 'macOS' : /Windows/.test(uaStr) ? 'Windows' : /Linux/.test(uaStr) ? 'Linux' : 'Unknown';
  var res = screen.width + 'x' + screen.height;
  var lang = navigator.language || '';
  var ref = document.referrer || '';
  fetch('https://ipapi.co/json/').then(function(r){return r.json()}).then(function(geo){
    var ip = geo.ip || 'unknown';
    var country = geo.country_name || '';
    var city = geo.city || '';
    var params = 'mode=visit&src=' + selectedSource + '&ip=' + encodeURIComponent(ip) + '&country=' + encodeURIComponent(country) + '&city=' + encodeURIComponent(city) + '&browser=' + encodeURIComponent(browser) + '&os=' + encodeURIComponent(os) + '&res=' + encodeURIComponent(res) + '&ref=' + encodeURIComponent(ref) + '&lang=' + encodeURIComponent(lang);
    new Image().src = APPS_SCRIPT_URL + '?' + params;
  }).catch(function(){
    var params = 'mode=visit&src=' + selectedSource + '&ip=unknown&browser=' + encodeURIComponent(browser) + '&os=' + encodeURIComponent(os) + '&res=' + encodeURIComponent(res) + '&ref=' + encodeURIComponent(ref) + '&lang=' + encodeURIComponent(lang);
    new Image().src = APPS_SCRIPT_URL + '?' + params;
  });
}

function raceFetch() {
  var done = false;
  var fails = 0;
  var proxies = getProxies(selectedSource);
  proxies.forEach(function(url, i) {
    fetch(url)
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(d) {
        if (!done) { done = true; render(d); }
      })
      .catch(function(e) {
        console.log('Proxy ' + i + ' failed:', e.message);
        fails++;
        if (fails >= proxies.length && !done) {
          document.getElementById('loader').innerHTML = '<p style="color:#ff3b30">데이터 로딩 오류<br><small style="color:#86868b">모든 프록시 실패 · 잠시 후 다시 시도해주세요</small><br><button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;border:1.5px solid #0071e3;background:#fff;color:#0071e3;border-radius:8px;font-size:13px;cursor:pointer">새로고침</button></p>';
        }
      });
  });
}

// ===== Chart.js =====
Chart.register(ChartDataLabels);
var BLUES = ['#0071e3','#2997ff','#5ab4f5','#7ec8f7','#a3d9fb','#c4e5fc','#dceefb','#edf5fd'];
var TEXT = '#1d1d1f';
var FLAGS = {'일본':'🇯🇵','한국':'🇰🇷','대만':'🇹🇼','싱가포르':'🇸🇬','말레이시아':'🇲🇾','태국':'🇹🇭','인도네시아':'🇮🇩','베트남':'🇻🇳','필리핀':'🇵🇭','중국':'🇨🇳','홍콩':'🇭🇰','미국':'🇺🇸','브라질':'🇧🇷','수도권':'🏙️','비수도권':'🌿'};

function sortDesc(obj) {
  var entries = [];
  for (var k in obj) entries.push([k, obj[k]]);
  entries.sort(function(a,b){ return b[1] - a[1]; });
  var labels = [], values = [];
  for (var i = 0; i < entries.length; i++) { labels.push(entries[i][0]); values.push(entries[i][1]); }
  return { labels: labels, values: values };
}

function donut(id, legendId, obj) {
  var s = sortDesc(obj);
  var labels = s.labels, values = s.values;
  var total = values.reduce(function(a,b){return a+b;},0);
  var colors = BLUES.slice(0, labels.length);
  new Chart(document.getElementById(id), {
    type:'doughnut',
    data:{labels:labels, datasets:[{data:values, backgroundColor:colors, borderWidth:2, borderColor:'#f5f5f7', hoverOffset:3}]},
    options:{cutout:'78%', responsive:true, maintainAspectRatio:true, plugins:{legend:{display:false}, datalabels:{display:false}}}
  });
  var html = '';
  for (var i = 0; i < labels.length; i++) {
    var pct = (values[i]/total*100).toFixed(1);
    html += '<div class="item"><span class="dot" style="background:'+colors[i]+'"></span><span>'+labels[i]+'</span><span class="val">'+values[i]+' ('+pct+'%)</span></div>';
  }
  document.getElementById(legendId).innerHTML = html;
}

function thinBar(id, obj, color) {
  var s = sortDesc(obj);
  var labels = s.labels, values = s.values;
  var total = values.reduce(function(a,b){return a+b;},0);
  var h = Math.max(labels.length * 38, 120);
  var el = document.getElementById(id);
  el.parentElement.style.height = h + 'px';
  new Chart(el, {
    type:'bar',
    data:{labels:labels, datasets:[{data:values, backgroundColor:color||'#0071e3', borderRadius:3, barThickness:14}]},
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false,
      layout:{padding:{right:90}},
      scales:{
        x:{display:false},
        y:{grid:{display:false}, ticks:{color:'#3a3a3c', font:{family:'Inter',size:12,weight:'600'}, padding:4}}
      },
      plugins:{
        legend:{display:false},
        datalabels:{
          anchor:'end', align:'right', offset:6,
          font:{family:'Inter',size:12,weight:'500'}, color:TEXT,
          formatter:function(v){return v+' ('+(v/total*100).toFixed(1)+'%)';}
        }
      }
    }
  });
}

function fmtTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var mm = ('0'+(d.getMonth()+1)).slice(-2);
  var dd = ('0'+d.getDate()).slice(-2);
  var hh = ('0'+d.getHours()).slice(-2);
  var mi = ('0'+d.getMinutes()).slice(-2);
  return mm+'/'+dd+' '+hh+':'+mi;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function sumObj(o) { var t=0; for(var k in o) t+=o[k]; return t; }

function render(d) {
  var isJp = d.source === 'jp';
  var fmt = function(n){ return Number(n).toLocaleString(); };

  // 히어로
  document.getElementById('heroTitle').textContent = isJp ? 'ONnOFF² IN JAPAN' : 'ONnOFF² 한국 팬미팅';
  document.getElementById('heroTotal').textContent = d.total;

  // 스탯 스트립
  document.getElementById('sTotal').textContent = d.total;
  document.getElementById('sPos').textContent = d.posRate + '%';
  document.getElementById('sRegion').textContent = d.regionRate + '%';
  document.getElementById('sRegionLabel').textContent = isJp ? '일본 거주' : '수도권';
  document.getElementById('sMsg').textContent = d.msgCount;

  // 차트 카드
  document.getElementById('countryTitle').textContent = isJp ? '거주 국가·지역' : '거주 지역';
  document.getElementById('surveySubtitle').textContent = d.total + '명의 응답을 기반으로 집계';
  document.getElementById('subCountry').textContent = '응답 ' + sumObj(d.country) + '개';
  document.getElementById('subPart').textContent = '응답 ' + sumObj(d.participate) + '개';
  document.getElementById('subCity').textContent = '복수선택 · 응답 ' + sumObj(d.city) + '개';
  document.getElementById('subPrice').textContent = '1인 기준 · 응답 ' + sumObj(d.price) + '개';
  document.getElementById('subProg').textContent = '복수선택 · 응답 ' + sumObj(d.program) + '개';
  donut('d-country','leg-country', d.country);
  donut('d-part','leg-part', d.participate);
  donut('d-price','leg-price', d.price);
  thinBar('b-city', d.city, '#2997ff');
  thinBar('b-prog', d.program, '#0071e3');

  // 수익 시뮬레이션
  var r = d.revenue;
  if (isJp) {
    document.getElementById('rAvg').textContent = '¥' + fmt(r.avgTicket) + ' (₩' + fmt(r.avgTicketKRW) + ')';
    document.getElementById('rStd').textContent = '±' + fmt(r.stdDev) + '명';
    document.getElementById('rOpt').textContent = '¥' + fmt(r.optRevenue);
    document.getElementById('rOptLabel').textContent = '낙관적 ~' + fmt(r.optAttendees) + '명';
    document.getElementById('rOptSub').textContent = '약 ' + fmt(r.optRevenueAlt) + '만원';
    document.getElementById('rCon').textContent = '¥' + fmt(r.conRevenue);
    document.getElementById('rConLabel').textContent = '보수적 ~' + fmt(r.conAttendees) + '명';
    document.getElementById('rConSub').textContent = '약 ' + fmt(r.conRevenueAlt) + '만원';
  } else {
    document.getElementById('rAvg').textContent = '₩' + fmt(r.avgTicket);
    document.getElementById('rStd').textContent = '±' + fmt(r.stdDev) + '명';
    document.getElementById('rOpt').textContent = '₩' + fmt(r.optRevenue);
    document.getElementById('rOptLabel').textContent = '낙관적 ~' + fmt(r.optAttendees) + '명';
    document.getElementById('rOptSub').textContent = '약 ' + fmt(r.optRevenueAlt) + '만원';
    document.getElementById('rCon').textContent = '₩' + fmt(r.conRevenue);
    document.getElementById('rConLabel').textContent = '보수적 ~' + fmt(r.conAttendees) + '명';
    document.getElementById('rConSub').textContent = '약 ' + fmt(r.conRevenueAlt) + '만원';
  }

  // 메시지
  document.getElementById('msgSubtitle').textContent = isJp
    ? d.msgCount + '개 · 최신순 · 일본어→한국어'
    : d.msgCount + '개 · 최신순';
  var msgHtml = '';
  for (var i = 0; i < d.messages.length; i++) {
    var m = d.messages[i];
    var flag = FLAGS[m.country] || '🌏';
    var time = fmtTime(m.timestamp);
    var text = m.translated || m.original;
    var showOrig = !m.isKorean && m.translated && m.translated !== m.original;
    msgHtml += '<div class="msg">' +
      '<div class="msg-meta">' + flag + ' ' + m.country + ' · ' + time + '</div>' +
      '<div class="msg-text">' + escHtml(text) + '</div>' +
      (showOrig ? '<div class="msg-orig">' + escHtml(m.original) + '</div>' : '') +
      '</div>';
  }
  document.getElementById('msgList').innerHTML = msgHtml;
  document.getElementById('loader').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  document.documentElement.style.position = 'relative';
}
</script>
</body>
</html>
